### model
model_name_or_path: Qwen/Qwen2.5-7B-Instruct
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 8
lora_alpha: 16
lora_dropout: 0.05
lora_target: all

### dataset
dataset: sigma_generation_train
eval_dataset: sigma_generation_validation
dataset_dir: data
template: qwen
cutoff_len: 1024
max_samples: 4
preprocessing_num_workers: 4
overwrite_cache: true

### output
output_dir: saves/Qwen2.5-7B-Instruct/lora/sigma_generation_smoke
logging_steps: 1
save_steps: 1
plot_loss: false
overwrite_output_dir: true
save_only_model: false
report_to: none

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 1
learning_rate: 1.0e-4
max_steps: 1
lr_scheduler_type: cosine
warmup_steps: 0
bf16: true
ddp_timeout: 180000000

### eval
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 1
